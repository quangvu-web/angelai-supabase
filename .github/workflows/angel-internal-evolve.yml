name: Angel Internal Evolution

on:
  repository_dispatch:
    types: [angel_edit_code]

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate payload (Phase 0 Safety Gate)
        env:
          FILE_PATH: ${{ github.event.client_payload.file_path }}
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message }}
        run: |
          set -e

          if [ -z "$FILE_PATH" ]; then
            echo "::error::Missing file_path"
            exit 1
          fi

          if [ -z "$BRANCH_NAME" ]; then
            echo "::error::Missing branch_name"
            exit 1
          fi

          # ALLOW: only src/**
          if [[ "$FILE_PATH" != src/* ]]; then
            echo "::error::Phase 0 only allows src/**. Refused: $FILE_PATH"
            exit 1
          fi

          # Block absolute paths and path traversal
          if [[ "$FILE_PATH" == /* ]] || [[ "$FILE_PATH" == *".."* ]]; then
            echo "::error::Invalid file_path: $FILE_PATH"
            exit 1
          fi

          # BLOCK core / generated / secrets
          case "$FILE_PATH" in
            src/integrations/supabase/*)
              echo "::error::Blocked auto-generated file: $FILE_PATH"
              exit 1
              ;;
            *.env|*.env.*|package.json|package-lock.json|bun.lockb|vite.config.ts|tsconfig*.json)
              echo "::error::Blocked protected file: $FILE_PATH"
              exit 1
              ;;
          esac

          # Branch contract
          if [[ ! "$BRANCH_NAME" =~ ^angel/[a-z0-9-]+$ ]]; then
            echo "::error::branch_name must match ^angel/[a-z0-9-]+$: $BRANCH_NAME"
            exit 1
          fi

          # Commit message
          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "::error::Missing commit_message"
            exit 1
          fi

          if [ ${#COMMIT_MESSAGE} -gt 200 ]; then
            echo "::error::commit_message must be <= 200 chars"
            exit 1
          fi

          echo "Payload validated."

      - name: Apply patch (write file)
        env:
          CODE_CONTENT: ${{ github.event.client_payload.code_content }}
          FILE_PATH: ${{ github.event.client_payload.file_path }}
        run: |
          mkdir -p "$(dirname "$FILE_PATH")"
          printf "%s" "$CODE_CONTENT" > "$FILE_PATH"

      - name: Commit and push branch
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message }}
        run: |
          set -e

          git config user.name "Angel-AI"
          git config user.email "angel@fun-ecosystem.com"

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Angel: evolve workspace"
          fi

          git checkout -B "$BRANCH_NAME"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push origin "$BRANCH_NAME" --force

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build check (continue-on-error)
        id: build
        continue-on-error: true
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set build_passed output
        id: buildflag
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "BUILD_PASSED=true" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD_PASSED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request (always)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.client_payload.pr_title }}
          PR_BODY: ${{ github.event.client_payload.pr_body }}
          BUILD_PASSED: ${{ steps.buildflag.outputs.BUILD_PASSED }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="Angel Evolution PR"
          fi

          if [ -z "$PR_BODY" ]; then
            PR_BODY="Auto-generated by Angel via repository_dispatch."
          fi

          if [ "$BUILD_PASSED" != "true" ]; then
            LABELS="angel-evolve,phase-1-single-file,build-failed"
            {
              echo "⚠️ **BUILD FAILED** — KHÔNG được auto-merge. Coordinator phải debug trước."
              echo ""
              echo "---"
              echo ""
              echo "$PR_BODY"
            } > pr_body.md
          else
            LABELS="angel-evolve,phase-1-single-file"
            printf "%s\n" "$PR_BODY" > pr_body.md
          fi

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file pr_body.md \
            --head "$(git rev-parse --abbrev-ref HEAD)" \
            --base "main" \
            --label "$LABELS" 2>&1 | tail -n1 || true)

          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR URL: $PR_URL"

      - name: Notify guard (callback to Supabase)
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.EVOLVE_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.EVOLVE_CALLBACK_SECRET }}
          LOG_ID: ${{ github.event.client_payload.log_id }}
          PR_URL: ${{ steps.pr.outputs.PR_URL }}
          BUILD_PASSED: ${{ steps.buildflag.outputs.BUILD_PASSED }}
        run: |
          if [ -z "$CALLBACK_URL" ] || [ -z "$LOG_ID" ]; then
            echo "Callback skipped: missing CALLBACK_URL or LOG_ID"
            exit 0
          fi

          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-callback-secret: $CALLBACK_SECRET" \
            -d "{\"log_id\":\"$LOG_ID\",\"pr_url\":\"$PR_URL\",\"build_passed\":$BUILD_PASSED}" \
            || echo "Callback failed (non-fatal)"
